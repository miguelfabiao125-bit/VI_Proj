<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pokémon Cards Visualization</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="d3.v7.min.js"></script>
    <script defer src="data.js"></script>
    <script defer src="graphs/lineChart.js"></script>
    <script defer src="main.js"></script>
</head>

<body>

    <div class="card">
        <div class="circle"></div>

        <div class="top-area">
            <img src="img/toppart.png" alt="Layout do topo (placeholder)">
        </div>

        <div class="bottom-area">
            <div class="view-left">
                <img src="img/leftpart.png" alt="Layout da parte esquerda (placeholder)">
            </div>
            <div id="line-chart" class="view-right"></div>
        </div>
    </div>

</body>
</html>
