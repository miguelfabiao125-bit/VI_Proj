<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pokémon Cards Visualization</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="d3.v7.min.js"></script>
    <script defer src="data.js"></script>
    <script defer src="graphs/lineChart.js"></script>
    <script defer src="graphs/artistList.js"></script>
    <script defer src="graphs/artistPair.js"></script>
    <script defer src="graphs/cardGallery.js"></script>
    <script defer src="main.js"></script>
</head>

<body>

    <div class="card">
         <div class="band"></div> 
        <div class="circle"></div>

        <div class="top-area">
    <div id="artist-list" class="view-artists"></div>
    <div id="artist-pair" class="view-pair"></div> 
    <div id="card-gallery" class="view-gallery"></div>
</div>

        <div class="bottom-area">
            <div class="view-left">
                <img src="img/leftpart.png" alt="Layout da parte esquerda (placeholder)">
            </div>
            <div id="line-chart" class="view-right"></div>
        </div>
    </div>

</body>
</html>
